<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge graph — Waypoint</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" defer></script>
<style>
  .graph-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-bottom: 50px; }
  #graphHost { position: relative; height: min(76vh, 780px); min-height: 480px; border-radius: 22px; overflow: hidden; background: var(--paper); border: 1px solid #dfe6e3; }
  #graph { width: 100%; height: 100%; display: block; touch-action: none; }
  .g-controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 14px; }
  .g-controls label { display: flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 500; }
  .g-controls input[type=range] { width: 120px; }
  .g-legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px; background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 12px; font-size: .82rem; }
  .g-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #nodeInfo { position: sticky; top: calc(var(--nav-h) + 16px); }
  @media (max-width: 960px) { .graph-layout { grid-template-columns: 1fr; } #graphHost { height: 70vh; } }
</style>
</head>
<body data-page="graph" data-base="../">
<div id="nav"></div>
<main id="main">
  <div class="wrap">
    <div class="page-head">
      <div><h1 style="font-size:clamp(2rem,4vw,3.2rem)">🌐 Your career knowledge graph</h1>
        <p class="muted">You in the middle, your best-matched careers around you, and the tools and courses that connect them.</p></div>
      <span class="small muted" id="gStats"></span>
    </div>
    <div class="g-controls">
      <label>Careers shown <input type="range" id="gCount" min="3" max="20" value="8"><output id="gCountOut">8</output></label>
      <label><input type="checkbox" id="gCourses" checked> Courses</label>
      <label><input type="checkbox" id="gCore"> Core skills</label>
      <input class="input" id="graphSearch" placeholder="Find a skill or career…" style="max-width:260px;margin-left:auto" aria-label="Find a node">
    </div>
    <div class="graph-layout">
      <div id="graphHost">
        <svg id="graph" role="img" aria-label="Force-directed graph linking you to careers, skills and courses"></svg>
        <div class="g-legend">
          <span><i style="background:#f2a541"></i>Career</span><span><i style="background:#1f7a74"></i>Skill you have</span>
          <span><i style="background:#d1495b"></i>Skill to learn</span><span><i style="background:#6c8ead"></i>Course</span><span><i style="background:#8a9aa8"></i>Core skill</span>
        </div>
      </div>
      <aside class="panel" id="nodeInfo"></aside>
    </div>
  </div>
</main>
<script src="../js/app.js" defer></script>
</body>
</html>
